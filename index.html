  <script>
    const discord = document.getElementById('discord');
    const discordLabel = discord.querySelector('.link-text');
    const discordOriginal = discordLabel.textContent;

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      return Promise.resolve();
    }

    discord.addEventListener('click', () => {
      copyText('defender_2').then(() => {
        discordLabel.textContent = 'Скопировано: defender_2';
        setTimeout(() => {
          discordLabel.textContent = discordOriginal;
        }, 1500);
      });
    });
